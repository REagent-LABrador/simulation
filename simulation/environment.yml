# Locked micromamba environment for the druggability-dossier simulation module.
# The module is self-contained; it depends on no other repo.
#
# REPLAY NEEDS ONLY Python + jsonschema. `python3 -m simulation run --mode replay`
# resolves the request against the bundled cache in simulation/cache/ (real
# dossiers) entirely LOCALLY — no cloud, no Modal, no Paperclip, no managed
# agent, no API key — so no gemmi/fpocket/GPU deps are listed and none are needed.
#
# LIVE uses a separately configured full LABrador checkout (its handlers run
# client-side), not covered by this file:
#
#   LABRADOR_RUNTIME_ROOT=/path/to/LABrador python -m simulation run --mode live ...
#
# This env is named distinctly so `env create -f` never clobbers the operator's
# richer `druggability` env (which already carries jsonschema, so you can also
# just use that one).
name: druggability-simulation
channels:
  - conda-forge
dependencies:
  - python=3.14
  - pip=25.2
  - pip:
      - jsonschema==4.26.0
      - attrs==26.1.0
      - jsonschema-specifications==2025.9.1
      - referencing==0.37.0
      - rpds-py==2026.6.3
