ote":"RES and NAC enhance HCC formation in both DEN/HFD and AKT/Ras mice.","paper":"p5","where":"den/hfd and akt/ras mice","is_own_result":true,"hedged":false,"confidence":0.9}},"papers":{"p5":{"title":"Resveratrol and N-acetylcystein reduce hepatic steatosis but enhance initiation and progression of hepatocellular carcinoma by inhibiting GST-pi-MAPK axis in mice","year":2025,"journal":"Frontiers in Pharmacology","doi":"10.3389/fphar.2025.1574039","first_author":"Mi Zhang","study_type":"animal","is_preprint":false}},"things":{"t1":{"name":"N-acetylcysteine (NAC)","kind":"small_molecule","aliases":["N-acetyl-cysteine","N-acetylcystein","N-acetylcysteine","NAC"],"mentions":1},"t16":{"name":"hepatocellular carcinoma (HCC) initiation and progression","kind":"process","aliases":["HCC formation","HCC growth"],"mentions":1},"t4":{"name":"Resveratrol","kind":"small_molecule","aliases":["RES"],"mentions":1}},"gap":{"id":"g3","missing":["t1","t4"],"implied_by":["L28","L7"],"note":"both connect to t16; no direct link reported (implied via 2 intermediates)","confidence":0.3203,"searched_in_round":null},"per_link_support":[{"link_id":"L7","evidence_quality":0.54,"agreement":1.0,"independence":0.0,"support":0.566,"stated_overall":0.44,"yes_count":1,"no_count":0,"groups":1,"capped":false,"paper_ids":["p5"],"conditions":["den/hfd and akt/ras mice"]},{"link_id":"L28","evidence_quality":0.54,"agreement":1.0,"independence":0.0,"support":0.566,"stated_overall":0.44,"yes_count":1,"no_count":0,"groups":1,"capped":false,"paper_ids":["p5"],"conditions":["den/hfd and akt/ras mice"]}],"scoring_notes":[]},"caveats":["The search is a sample, not the literature: 19 of 98 results were read. Absence of a link is weak evidence of absence.","This chain traverses at least one link against its stated direction. Do not assert the reverse relation as established.","Novelty here rests on a gap, but this graph is not entitled to strong absence claims. Treat 'nobody has shown X' as 'this search did not surface X'."],"articulation":{"statement":"N-acetylcysteine and resveratrol enhance hepatocellular carcinoma initiation and progression through the same mechanistic bottleneck (inhibition of the GST-pi-MAPK axis) and are therefore mutually redundant rather than additive: in DEN/HFD or AKT/Ras mice, co-administration of NAC + resveratrol will produce no greater HCC burden, and no greater GST-pi-MAPK suppression, than either compound alone at a dose that already maximally suppresses that axis.","mechanism":"The pack links t1 (NAC) --increases--> t16 (HCC initiation and progression) [L7/f16] and t4 (Resveratrol) --increases--> t16 [L28/f15], both from the same experimental report (p5) and the same conditions (DEN/HFD and AKT/Ras mice). p5's title identifies a single downstream route for both agents: reduction of hepatic steatosis together with inhibition of the GST-pi-MAPK axis. If both small molecules converge on that one axis, then the missing t1<->t4 relation is not causal influence of one on the other but mechanistic equivalence: each occupies the same node, so their pro-tumorigenic effects should occlude one another (epistasis / ceiling), and each should be substitutable for the other in the DEN/HFD and AKT/Ras models. The proposed direct edge is therefore 'NAC --is functionally interchangeable with / occludes--> Resveratrol' with respect to t16.","claims":[{"text":"NAC increases HCC initiation and progression in DEN/HFD and AKT/Ras mice.","cites":["L7","f16","p5","t1","t16"],"inferred":false},{"text":"Resveratrol increases HCC initiation and progression in the same DEN/HFD and AKT/Ras mouse models.","cites":["L28","f15","p5","t4","t16"],"inferred":false},{"text":"The HCC-enhancing effect of both compounds is mediated by inhibition of the GST-pi-MAPK axis, as asserted by the source report.","cites":["p5"],"inferred":false},{"text":"Because both agents act on the same GST-pi-MAPK node, their effects on HCC formation are mutually occluding: NAC + resveratrol together yield HCC tumor number and burden statistically indistinguishable from either single agent.","cites":["L7","L28","p5"],"inferred":true},{"text":"NAC and resveratrol are functionally interchangeable with respect to t16 in these models: swapping one for the other at axis-saturating doses reproduces the same magnitude of HCC enhancement and the same degree of GST-pi-MAPK suppression.","cites":["f15","f16","t1","t4","t16"],"inferred":true},{"text":"Reactivating MAPK signaling downstream of GST-pi abolishes the HCC-enhancing effect of NAC and of resveratrol to a comparable degree, rather than only one of them.","cites":["p5","L7","L28"],"inferred":true},{"text":"No direct NAC-resveratrol relation is reported in this graph; the pair is connected only through t16 in a chain traversed against its stated direction, so no reverse effect of HCC on resveratrol is asserted here.","cites":["g3","L28"],"inferred":false}],"novel_because":"The pack states each compound's effect on t16 separately (L7, L28) from one shared report (p5), and flags g3 as never searched. It does not state any relation between t1 and t4 themselves — in particular it does not state that they share a single rate-limiting mechanistic node, that their effects occlude rather than add, or that they are interchangeable in these models. The graph's only bridge is the shared object t16, and the chain runs against L28's direction, so the equivalence/epistasis relation proposed here is not contained in the pack. Absence of a reported direct link is weak evidence (19/98 results read), so this is a gap in this sample, not a claim that no one has tested a combination.","predictions":["In DEN/HFD mice, tumor number and liver/body weight ratio in the NAC + resveratrol arm fall within the confidence interval of the NAC-alone and resveratrol-alone arms, while both exceed vehicle.","Hepatic GST-pi activity and phospho-MAPK (ERK/JNK/p38) levels are suppressed to the same floor by NAC alone, resveratrol alone, and the combination.","The same occlusion pattern holds in AKT/Ras mice, the second condition in which both single-agent effects were observed (f15, f16).","Hepatic steatosis is likewise reduced to a similar extent by either agent and not further reduced by the combination.","Hepatocyte-specific restoration of GST-pi or forced MAPK activation removes the HCC excess in both single-agent arms and in the combination arm."],"falsifier":"In DEN/HFD (or AKT/Ras) mice, NAC + resveratrol produces significantly greater HCC tumor burden than the more effective single agent while GST-pi-MAPK suppression is already maximal in the single-agent arms — supra-additivity that is incompatible with a single shared bottleneck.","decisive_experiment":"A four-arm DEN/HFD mouse study (vehicle, NAC, resveratrol, NAC + resveratrol; n sufficient for tumor counts), reading out tumor number/size plus hepatic GST-pi activity and phospho-MAPK. The dull alternative — 'two independent agents that each happen to promote HCC' (L7, L28) — predicts additive or greater-than-single-agent tumor burden in the combination arm; the shared-bottleneck hypothesis predicts a flat ceiling with identical GST-pi-MAPK suppression across all three treated arms. One extra arm on an already-established model discriminates them.","assumptions":["Doses used for the single agents in p5 are at or near the ceiling of GST-pi-MAPK suppression, so occlusion is detectable rather than masked by sub-saturating dosing.","NAC and resveratrol do not interact pharmacokinetically (e.g., altered absorption or metabolism) in a way that changes exposure when co-administered.","The GST-pi-MAPK axis named in p5's title is the dominant, rate-limiting route to the HCC enhancement, not one of several parallel routes.","Neither compound has an additional pro- or anti-tumorigenic activity off the GST-pi-MAPK axis that becomes visible only in combination.","Tumor burden endpoints in these models are not already saturated by the single agents for reasons unrelated to the shared mechanism."]},"critiques":[{"verdict":"partly_supported","strongest_objection":"The entire mechanistic core — claim 2, on which claims 3, 4 and 5 depend — is carried by a single string: the title of p5. No finding in the pack (f15/f16 are the same sentence) reports any GST-pi or MAPK measurement, any comparison of the two compounds' effect on that axis, or any evidence that the axis is the rate-limiting step. Worse, that same title names two effects — 'reduce hepatic steatosis' AND 'inhibit GST-pi-MAPK axis' — so even the source's own framing is compatible with more than one route, which is exactly what the single-bottleneck assumption forbids. And even granting the title in full, 'both agents inhibit the same axis' does not license 'both enter the axis at the same step at saturating dose'; a thiol reductant and a polyphenol can plausibly converge on GST-pi from different upstream points, in which case combination is additive and the occlusion prediction fails without any of the hypothesis's mechanism being wrong. The proposed edge is an epistasis claim built from two arrows pointing into one coarse process node (t16) — convergence in a graph is not convergence in a pathway.","unsupported_leaps":["From 'both compounds increase t16' (L7, L28) to 'both act through one rate-limiting node'. The shared node in the graph is the outcome process (HCC initiation/progression), not a mechanistic step; nothing in f15/f16 is mechanistic.","From 'same axis named in a title' to 'occlusion / flat ceiling in combination'. Epistasis requires that both agents saturate the same step; the pack contains no dose-response, no axis-activity readout, and no combination arm.","From one sentence that names both compounds together ('RES and NAC enhance HCC formation') to the assumption that p5 ran separate single-agent arms. The pack cannot distinguish a parallel-arms design from a combined-treatment arm; if the latter, L7 and L28 are the graph's own decomposition, and the hypothesis's 'decisive experiment' may already be inside p5.","From no quantitative data at all to 'the same magnitude of HCC enhancement and the same degree of GST-pi-MAPK suppression' (claim 4). No effect sizes, tumor counts, or axis measurements appear anywhere in the pack.","From the title's 'inhibiting GST-pi-MAPK axis' to a specific, testable epistatic architecture in which MAPK reactivation is a downstream rescue point (claim 5). The pack does not even specify which MAPK, its direction of effect on hepatocarcinogenesis, or that GST-pi sits upstream of it in these mice.","Treating L7 and L28 as two links is a presentational artifact: f16 and f15 are verbatim the same sentence from the same page of the same paper. The hypothesis's framing ('the pack states each compound's effect... separately') overstates the independence of the two edges."],"per_claim":[{"claim_index":0,"verdict":"supported","reason":"Directly asserted by the source sentence f16 in the stated conditions, and L7 records exactly this direction. Caveat: single source, single sentence, recomputed_support 0.566 — supported as reported, not corroborated.","cites":["L7","f16","p5"]},{"claim_index":1,"verdict":"supported","reason":"Same status as claim 0: f15 is the source sentence and L28 records t4 --increases--> t16 in the same models. Note f15 and f16 are the identical sentence, so claims 0 and 1 are one observation reported twice, not two independent findings.","cites":["L28","f15","f16","p5"]},{"claim_index":2,"verdict":"partly_supported","reason":"The GST-pi-MAPK attribution appears only in p5's title metadata; no finding in the pack measures GST-pi or MAPK, attributes the axis to each compound individually, or establishes it as rate-limiting. The same title also names reduced hepatic steatosis, i.e. at least one other candidate route, which undercuts the 'single mechanistic bottleneck' reading the hypothesis needs.","cites":["p5","f15","f16"]},{"claim_index":3,"verdict":"unsupported","reason":"Pure inference. Occlusion requires (a) a shared step, (b) saturating dosing, (c) no parallel routes — none of which is in the pack. The graph's only bridge between t1 and t4 is the shared outcome node t16 (g3), and shared outcome is compatible with additivity. This is the hypothesis's load-bearing claim and it rests on nothing in the evidence beyond a title.","cites":["L7","L28","g3","p5"]},{"claim_index":4,"verdict":"unsupported","reason":"'Same magnitude' and 'same degree of suppression' are quantitative claims; the pack contains no quantities. f15/f16, being one sentence, group the two agents rhetorically but report no comparison between them. 'Axis-saturating doses' is an assumption the pack cannot check.","cites":["f15","f16","p5"]},{"claim_index":5,"verdict":"unsupported","reason":"No rescue or epistasis data in the pack, and no finding establishing that MAPK lies downstream of GST-pi in this model or that MAPK signaling is protective here (the direction the claim implicitly needs). The claim is constructed entirely from the title plus L7/L28.","cites":["p5","L7","L28"]},{"claim_index":6,"verdict":"supported","reason":"Accurate description of the graph: g3 records no direct t1-t4 link, the chain traverses L28 against its stated direction, and the hypothesis correctly declines to assert HCC --increases--> resveratrol. The graph's caveat about weak absence evidence (19/98 read) is also acknowledged.","cites":["g3","L28"]}],"alternative_explanation":"One 2025 mouse study reports that two chemically unrelated antioxidants — a thiol (NAC) and a polyphenol (resveratrol) — each reduce steatosis yet each increase HCC burden in DEN/HFD and AKT/Ras models, and the authors offer GST-pi-MAPK as their interpretation. The duller reading is simply 'antioxidant supplementation can promote hepatocarcinogenesis in these models', with the two agents plausibly reaching that outcome by partly different upstream chemistry (glutathione/redox buffering vs. SIRT1/AMPK-type polyphenol effects) that happens to touch a common downstream axis. On that reading a combination arm would be additive or intermediate, the compounds would not be interchangeable at matched doses, and the co-occurrence of RES and NAC in one sentence reflects nothing more than a parallel-arm experimental design in a single paper.","lens":"mechanism"},{"verdict":"partly_supported","strongest_objection":"The pack's apparent 'convergence' of two agents is one observation counted twice. f15 and f16 are verbatim the same sentence ('RES and NAC enhance HCC formation in both DEN/HFD and AKT/Ras mice') from the same page of the same paper (p5), so L7 and L28 are not two links but one co-reported claim from one group, and their identical recomputed_support (0.566) reflects that shared single source. Worse, the load-bearing premise for claims 3-5 — that the mechanism is inhibition of the GST-pi-MAPK axis — appears nowhere in the findings; it exists only in p5's title. There is no finding-level evidence that GST-pi or MAPK were measured, for which compound, at what dose, or that the axis is rate-limiting rather than one of several routes (the same title also reports reduced hepatic steatosis, a distinct phenotype). Building a quantitative epistasis prediction ('statistically indistinguishable', 'same magnitude of suppression') on a title clause is a title-to-mechanism leap the pack cannot license.","unsupported_leaps":["Treating L7 and L28 as two links when f15 and f16 are the identical sentence from p5 — no independent corroboration of either compound's effect exists in this pack.","Inferring 'shared rate-limiting node' from a paper title that names GST-pi-MAPK once, with zero findings reporting any GST-pi or MAPK measurement, any dose, or which compound the mechanistic data came from.","Inferring occlusion/non-additivity from a shared axis: a common downstream node is fully compatible with additivity if single-agent doses are sub-saturating, if the compounds act at different upstream entry points, or if steatosis reduction contributes in parallel. The hypothesis lists this as an assumption but the pack contains no dose or dose-response data with which to check it, so the stated falsifier (supra-additivity) is escapable by appeal to sub-saturating dosing — the decisive experiment as designed cannot cleanly discriminate.","Inferring 'functionally interchangeable' magnitudes when the single source sentence is qualitative ('enhance') and reports no effect sizes for either agent, hence no basis for comparing them to each other.","Positing a MAPK-reactivation rescue that abolishes both effects comparably — no rescue, gain-of-function, or genetic epistasis experiment is represented anywhere in the pack."],"per_claim":[{"claim_index":0,"verdict":"supported","reason":"f16 states exactly this, in the stated models, from a primary animal study. Correctly scoped to mice, no human generalisation. Caveat only: single_source, and the sentence is qualitative (no effect size).","cites":["L7","f16","p5"]},{"claim_index":1,"verdict":"partly_supported","reason":"The propositional content is in f15 — but f15 is the same sentence as f16 from the same page of the same paper. So this is not independent confirmation alongside claim 0; L7/L28 are one finding split into two edges. The claim itself is true to the source; the implied independence of the two edges is not.","cites":["L28","f15","f16","p5"]},{"claim_index":2,"verdict":"partly_supported","reason":"The only support is p5's title. No finding in the pack reports GST-pi or MAPK data, which compound they were measured for, or that inhibition mediates (rather than accompanies) the HCC enhancement. The claim's hedge ('as asserted by the source report') is honest about the provenance, but title-level assertion cannot carry the mediation weight that claims 3-5 place on it.","cites":["p5","f15","f16"]},{"claim_index":3,"verdict":"unsupported","reason":"No combination arm exists anywhere in the pack — f15/f16 report single-agent effects only. Occlusion also does not follow deductively from a shared node without dose-saturation data, which the pack lacks entirely. Marked INFERRED, and it is inference on top of a title clause.","cites":["f15","f16","p5","L7","L28"]},{"claim_index":4,"verdict":"unsupported","reason":"The single source sentence is qualitative and gives no magnitude for either agent, no doses, and no GST-pi-MAPK quantification, so 'same magnitude of HCC enhancement' and 'same degree of suppression' have no evidential basis. Mechanistically, NAC (thiol reductant) and resveratrol (polyphenol) are not shown by the pack to enter the axis at the same point.","cites":["f15","f16","t1","t4"]},{"claim_index":5,"verdict":"unsupported","reason":"Nothing in the pack reports any manipulation of MAPK downstream of GST-pi, in either compound's arm. Purely inferred from the title's mechanistic phrase.","cites":["p5","L7","L28"]},{"claim_index":6,"verdict":"supported","reason":"g3 records that no direct t1-t4 link was reported and was never searched, and the graph caveat confirms the chain traverses L28 against its stated direction; the claim correctly declines to assert any reverse effect and correctly frames absence as absence in this sample (19/98 read).","cites":["g3","L28"]}],"alternative_explanation":"p5 is a single study that happened to run two antioxidants as parallel arms and reported both in one sentence. The duller reading is a class-level phenotype — two antioxidants each independently relieve oxidative stress/steatosis in these models and each independently permits more HCC — with no shared rate-limiting node implied. The 'convergence' in the graph is an artefact of one sentence being split into two edges (f15 = f16), and the GST-pi-MAPK phrase in the title may have been demonstrated for only one agent, or as a correlate rather than a mediator. On that reading, co-administration would be expected to be additive or unremarkable, and no t1-t4 edge of any kind is warranted.","lens":"evidence"}],"verdict":"partly_supported","verification":{"verdict":"qualified","gates":[{"name":"structure","status":"pass","summary":"2 hop(s), path intact, not already stated","issues":[],"halting":true},{"name":"citations","status":"pass","summary":"9 ids, all legal","issues":[],"halting":true},{"name":"consistency","status":"warn","summary":"claim[1] cites L28 in the reverse of its stated direction but is not marked inferred","issues":[{"code":"reversed_link_asserted","detail":"claim[1] cites L28 in the reverse of its stated direction but is not marked inferred","severity":"warning"},{"code":"reversed_link_asserted","detail":"claim[6] cites L28 in the reverse of its stated direction but is not marked inferred","severity":"warning"}],"halting":false},{"name":"independence","status":"warn","summary":"all primary evidence here is from Mi Zhang; nothing replicates it","issues":[{"code":"single_group","detail":"all primary evidence here is from Mi Zhang; nothing replicates it","severity":"warning"}],"halting":true},{"name":"falsifiability","status":"pass","summary":"falsifier and experiment both concrete","issues":[],"halting":false},{"name":"adversarial","status":"warn","summary":"2 lenses (mechanism, evidence) → partly_supported","issues":[],"halting":false}],"halted_at":null},"elo":null,"evolved_from":null,"evolution_operator":null,"issues":[{"code":"reversed_link_asserted","detail":"claim[1] cites L28 in the reverse of its stated direction but is not marked inferred","severity":"warning"},{"code":"reversed_link_asserted","detail":"claim[6] cites L28 in the reverse of its stated direction but is not marked inferred","severity":"warning"},{"code":"single_group","detail":"all primary evidence here is from Mi Zhang; nothing replicates it","severity":"warning"}],"asks":[],"provenance":"gap_closure over g_e087@round1 via L7, L28"},{"id":"H-g27","motif":"gap_closure","subject":"t2","object":"t8","subject_name":"Vitamin E","object_name":"BACH1","hops":2,"tags":["uns s_preprint":false},"p3":{"title":"ROS-lowering doses of vitamins C and A accelerate malignant melanoma metastasis","year":2023,"journal":"Redox Biology","doi":"10.1016/j.redox.2023.102619","first_author":"Muhammad Kashif","study_type":"animal","is_preprint":false}},"things":{"t2":{"name":"Vitamin E","kind":"small_molecule","aliases":["Trolox","VE","alpha-tocopherol","vitamin E","vitamin E analogue","α-tocopherol"],"mentions":1},"t11":{"name":"melanoma metastasis","kind":"process","aliases":["distant metastasis by melanoma cells","malignant melanoma metastasis","melanoma metastatic spread"],"mentions":1},"t8":{"name":"BACH1","kind":"gene","aliases":["Bach1"],"mentions":1}},"gap":{"id":"g27","missing":["t2","t8"],"implied_by":["L10","L36"],"note":"both connect to t11; no direct link reported","confidence":0.0832,"searched_in_round":null},"per_link_support":[{"link_id":"L10","evidence_quality":0.51,"agreement":1.0,"independence":0.0,"support":0.554,"stated_overall":0.44,"yes_count":1,"no_count":0,"groups":1,"capped":false,"paper_ids":["p2"],"conditions":["melanoma xenograft mice"]},{"link_id":"L36","evidence_quality":0.48,"agreement":1.0,"independence":0.0,"support":0.542,"stated_overall":0.44,"yes_count":1,"no_count":0,"groups":1,"capped":false,"paper_ids":["p3"],"conditions":["xenograft mouse, bach1 knockout"]}],"scoring_notes":[]},"caveats":["The search is a sample, not the literature: 19 of 98 results were read. Absence of a link is weak evidence of absence.","This chain traverses at least one link against its stated direction. Do not assert the reverse relation as established.","Novelty here rests on a gap, but this graph is not entitled to strong absence claims. Treat 'nobody has shown X' as 'this search did not surface X'."],"articulation":{"statement":"Vitamin E (Trolox), at the in vivo dose that decreases melanoma metastatic growth, does not activate BACH1 in melanoma cells — unlike the ROS-lowering doses of vitamins C and A that activate BACH1 — so Trolox's anti-metastatic effect is BACH1-independent and is preserved in Bach1-knockout melanoma.","mechanism":"The graph links Vitamin E to melanoma metastasis negatively (L10/f5) and BACH1 to melanoma metastasis positively (L36/f10), with t11 as the only shared node and no direct t2–t8 edge (g27). The proposed missing relation across that gap is a negative/null one: the BACH1 activation reported for antioxidant administration in p3 (ROS-lowering vitamin C and A doses) is not a generic consequence of antioxidant exposure. Trolox, as administered in p2, fails to trigger the BACH1 transcriptional program, so the pro-metastatic BACH1 arm (t8 --activates--> t11) is not engaged; the metastasis-decreasing effect seen in f5 therefore proceeds through a BACH1-independent route and should survive removal of Bach1.","claims":[{"text":"Trolox, a vitamin E derivative, decreased metastatic growth when administered in vivo in melanoma xenograft mice.","cites":["L10","f5","p2","t2","t11"],"inferred":false},{"text":"BACH1 is activated following antioxidant administration, and Bach1 knockout in mouse melanoma cells reduces lymph node and liver metastasis in xenograft models.","cites":["L36","f10","p3","t8","t11"],"inferred":false},{"text":"The pack contains no direct reported relation between Vitamin E and BACH1 in either direction; the two are connected only through melanoma metastasis.","cites":["g27","t2","t8","t11"],"inferred":false},{"text":"At the Trolox exposure that decreases metastatic growth, melanoma cells show no significant induction of BACH1 protein stabilization/nuclear accumulation or of the BACH1-dependent transcriptional signature detected after ROS-lowering vitamin C/A doses.","cites":["f5","f10","g27"],"inferred":true},{"text":"The metastasis-decreasing effect of Trolox is retained, with the same effect size, in Bach1-knockout mouse melanoma cells as in Bach1-wild-type cells in xenograft mice.","cites":["L10","L36","f5","f10"],"inferred":true},{"text":"BACH1 activation, rather than ROS-lowering antioxidant activity per se, is what separates metastasis-promoting antioxidants (N-acetylcysteine, vitamins C and A) from Trolox in these mouse melanoma models.","cites":["p2","p3","f5","f10"],"inferred":true}],"novel_because":"The graph states t2 --decreases--> t11 and t8 --activates--> t11 but reports no t2–t8 edge (g27, never searched for). It also never states whether the BACH1 activation in f10 is specific to the antioxidants tested there or general to antioxidants; the hypothesis supplies a directional, signed, dose-qualified answer (Vitamin E does NOT activate BACH1 at its anti-metastatic dose) plus a genetic-epistasis consequence (effect preserved in Bach1-KO) that the pack nowhere asserts. Absence of the edge here reflects an unsearched gap, not established absence.","predictions":["RNA-seq or qPCR of BACH1 target genes in mouse melanoma cells treated with Trolox at the p2-equivalent concentration shows no shift toward the BACH1-activated signature seen with ROS-lowering vitamin C, despite comparable ROS reduction.","BACH1 protein levels/nuclear fraction are unchanged by Trolox but increased by ROS-lowering vitamin C or N-acetylcysteine in the same cells and time window.","In Bach1-knockout mouse melanoma xenografts, Trolox still reduces metastatic burden; in wild-type it reduces it by a similar margin, i.e. no drug-by-genotype interaction.","Antioxidants that raise metastatic burden in these models (NAC, vitamin C, vitamin A) lose that effect in Bach1-knockout cells, whereas Trolox's direction of effect is unchanged."],"falsifier":"Trolox, at the concentration/dose that decreases metastatic growth, produces BACH1 activation (stabilization/nuclear accumulation and induction of the BACH1 target-gene signature) in melanoma cells at a magnitude comparable to ROS-lowering vitamin C or NAC.","decisive_experiment":"One in vitro dose-matched comparison: treat the same mouse melanoma line with Trolox at the p2 in vivo-equivalent exposure versus a ROS-lowering vitamin C dose versus vehicle; read out (a) intracellular ROS to confirm equivalent ROS lowering, (b) BACH1 protein and nuclear fraction by immunoblot, and (c) a small qPCR panel of BACH1 target genes. If ROS falls equally but BACH1 activation appears only with vitamin C, the hypothesis is supported over the dull alternative that all ROS-lowering antioxidants activate BACH1 and Trolox differed only through pharmacokinetics or dose. Confirm with a single Trolox arm in Bach1-KO versus WT xenografts.","assumptions":["Trolox's in vivo anti-metastatic effect in p2 reflects an action on melanoma cells that is reproducible in the mouse melanoma lines used for Bach1 knockout in p3.","An in vitro concentration can approximate the in vivo Trolox exposure achieved in f5.","The BACH1 activation in f10 is measurable by BACH1 protein/nuclear localization and a target-gene panel, not only by the full genomics analysis used there.","Both single-source links (L10, L36; recomputed support ~0.55) are real effects and not artifacts of one lab, model, or metastasis endpoint (metastatic growth in p2 vs lymph node/liver metastasis in p3).","Trolox and vitamin C/A can be dosed to comparable degrees of ROS lowering, so any BACH1 difference is not merely a difference in antioxidant potency."]},"critiques":[{"verdict":"partly_supported","strongest_objection":"The mechanism inverts the plainest reading of its own source sentence. f10 states that \"BACH1 is activated following antioxidant administration\" with no restriction to vitamins C and A, and f5 explicitly labels Trolox \"an antioxidant vitamin E derivative.\" On the pack's own wording, Trolox sits inside the class said to activate BACH1 — the pack leans against claim 3 rather than being silent on it. The hypothesis manufactures the specificity it needs by re-reading f10's generic \"antioxidant administration\" as \"the ROS-lowering vitamin C/A doses tested in p3,\" a narrowing the pack nowhere licenses. Worse, if one instead grants the sign-consistency argument the mechanism actually runs on (Trolox decreases t11 via L10; BACH1 increases t11 via L36; therefore Trolox should not be feeding the BACH1 arm), the relation implied across g27 is a *signed negative* edge — Vitamin E inhibits/represses BACH1 — which would explain f5 mechanistically. The hypothesis instead picks a null edge plus a preserved-effect epistasis prediction, i.e. the one closure that commits to no mechanism at all, and then calls it a mechanism. There is no step in the pack connecting Trolox exposure to any ROS or heme/BACH1-stability readout, so the causal story has a hole exactly where BACH1 regulation would have to happen.","unsupported_leaps":["Reading f10's unqualified \"following antioxidant administration\" as specific to ROS-lowering vitamin C/A doses, when f5 itself calls Trolox an antioxidant.","Choosing a null t2–t8 edge over the negative edge (Trolox inhibits BACH1) that the two stated link signs (L10 negative, L36 positive) would more naturally imply; the pack does not discriminate between these two closures.","Assuming Trolox at its f5 in vivo dose lowers intracellular ROS in melanoma cells at all, let alone to a degree comparable to vitamin C/A. No finding in the pack reports any ROS measurement for Trolox, so the whole 'same ROS lowering, different BACH1' contrast is asserted, not evidenced.","Transferring the f5 effect (unspecified melanoma xenograft, endpoint 'metastatic growth', p2) into the p3 system (mouse melanoma cells, endpoint lymph node and liver metastasis) as if line, model and endpoint were interchangeable — a requirement for the Bach1-KO epistasis prediction in claim 4.","Specifying equality of effect size in Bach1-KO vs WT (claim 4) when the pack contains no Trolox×Bach1 experiment of any kind.","Attributing NAC's pro-metastatic effect and vitamin C/A's pro-metastatic effect to BACH1 activation (claim 5) when no finding measures BACH1 in an NAC arm and NAC's phenotype is present only as a paper title (p2)."],"per_claim":[{"claim_index":0,"verdict":"supported","reason":"Verbatim from the source sentence, with the condition field matching. f5: \"Trolox, an antioxidant vitamin E derivative, administered in vivo, decreased metastatic growth,\" in melanoma xenograft mice. Note only that the endpoint is growth of metastases, not seeding, and that the link is single_source (recomputed_support 0.554).","cites":["f5","L10","p2","t2","t11"]},{"claim_index":1,"verdict":"supported","reason":"Reproduces f10 almost verbatim, including its generic phrase \"antioxidant administration.\" Single_source, primary basis. This claim's own generality is what undermines claim 3: the pack never says BACH1 activation is antioxidant-class-specific.","cites":["f10","L36","p3","t8","t11"]},{"claim_index":2,"verdict":"supported","reason":"Accurate as a statement about the pack: g27 records that both nodes connect only to t11 and that a direct t2–t8 link was never searched for. Correctly scoped to the pack rather than to the literature, consistent with the 19/98 sampling caveat.","cites":["g27","t2","t8","t11"]},{"claim_index":3,"verdict":"unsupported","reason":"No finding in the pack reports BACH1 protein, nuclear localisation, or target-gene expression under Trolox; f5 reports only an in vivo metastatic-growth endpoint. The one sentence that speaks to antioxidant-induced BACH1 activation (f10) is unrestricted as to antioxidant, and f5 classifies Trolox as an antioxidant — so the pack's literal content pushes mildly against this claim rather than leaving it open. The graph caveat about traversing L36 against direction also applies: nothing here establishes what antioxidant exposure does to BACH1 in the p2 setting.","cites":["f5","f10","g27","L36"]},{"claim_index":4,"verdict":"unsupported","reason":"Pure inference with two additional unfunded steps. (i) No Trolox arm exists in any Bach1-KO or WT comparison in the pack; f10's KO experiment has no antioxidant-vs-Trolox contrast reported. (ii) The prediction requires that f5's effect (p2, 'metastatic growth', line unspecified) reproduces in p3's mouse melanoma line with lymph-node/liver endpoints — a model transfer the pack cannot underwrite. The added quantitative specification ('same effect size') is invented and would fail even if the qualitative direction held.","cites":["f5","f10","L10","L36","p2","p3"]},{"claim_index":5,"verdict":"unsupported","reason":"Asserts a mechanistic discriminator with no measurement behind either arm. NAC's pro-metastatic effect appears only in p2's title; vitamins C/A's only in p3's title; no finding links either to BACH1 except f10's generic sentence, which does not name NAC. The 'rather than ROS-lowering per se' contrast additionally requires ROS data for Trolox that the pack does not contain, so the dull confound (potency, pharmacokinetics, lipid- vs water-soluble antioxidant, dose) is not excluded by anything cited.","cites":["p2","p3","f5","f10"]}],"alternative_explanation":"Nothing class-specific need be happening. Trolox is a lipid-soluble chain-breaking antioxidant dosed in a different lab, a different model and against a different endpoint (p2: growth of metastases) from p3 (seeding to lymph node and liver). The two links are single-source with ~0.55 support and are simply not commensurable: Trolox may never have reached the intracellular ROS-lowering threshold that stabilises BACH1, or may have lowered ROS in stroma rather than tumour cells, or the 'decreased metastatic growth' readout may be insensitive to the seeding step BACH1 controls. On that reading, Trolox could activate BACH1 exactly as vitamin C does and the phenotypic difference would be dose, tissue distribution and endpoint — with the true missing edge being either nothing at all or, if the sign logic is trusted, a plain inhibitory edge Vitamin E --inhibits--> BACH1, not the BACH1-independence the hypothesis proposes.","lens":"mechanism"},{"verdict":"partly_supported","strongest_objection":"The only claims the pack can carry are the two background restatements (0 and 1). All of the hypothesis's novel content (claims 3, 4, 5) is a strong signed negative — \"Trolox does not activate BACH1\" — derived entirely from the absence of a t2\tsflags as \"never searched for\" (g27). The pack's own caveats forbid that move (19/98 results read; absence of a link is weak evidence of absence). Worse, the single sentence that defines the BACH1 arm cuts the other way: f10 says \"BACH1 is activated following antioxidant administration\" — a generic antioxidant statement, not a vitamin-C/A-specific one. So the one piece of evidence bearing on the gap, read literally, predicts that Trolox (an antioxidant, per f5's own wording) would also activate BACH1. The hypothesis needs f10 to be narrow (specific to vitamins C/A) and simultaneously needs the graph's silence to be informative; the pack supports neither.","unsupported_leaps":["Reading g27 (an admittedly unsearched gap) as biological absence of a Vitamin E\tsBACH1 relation, then converting that absence into a positive mechanistic claim of BACH1-independence.","Narrowing f10's \"antioxidant administration\" to \"ROS-lowering vitamin C and A doses only\" — the finding sentence does not restrict the class, and the graph never states whether the effect is antioxidant-general or agent-specific (the hypothesis admits this, then assumes the answer it wants).","Cross-model epistasis: predicting that Trolox's effect survives Bach1 knockout requires the p2 effect (unnamed xenograft, 'metastatic growth') and the p3 Bach1-KO mouse melanoma line to be the same system. The pack gives no shared cell line, host, dosing route, or endpoint.","Quantitative smuggling: claim 4 asserts 'the same effect size', and claim 3 asserts 'no significant induction'. Neither magnitude nor a null threshold is anywhere in the pack; f5/f10 are qualitative single sentences.","Treating t2 as one entity: t2's aliases lump Trolox with α-tocopherol/vitamin E on the strength of a single paper, but the only evidence (f5) is for Trolox, a water-soluble analogue with different pharmacokinetics and tissue distribution. The hypothesis titles itself 'Vitamin E' while its evidence is one Trolox arm.","Importing NAC's pro-metastatic effect (claim 5) from p2's title rather than from any finding: the pack's only p2 finding is f5 (Trolox). No NAC finding, and certainly no NAC\tsBACH1 measurement, is in the pack."],"per_claim":[{"claim_index":0,"verdict":"supported","reason":"f5 states this almost verbatim, with condition 'melanoma xenograft mice', and L10 encodes it. The honest caveats: it is single_source (state=single_source, recomputed_support 0.554) and it is an incidental comparator arm inside a paper whose stated subject is the opposite result for a different antioxidant (p2: 'N-Acetylcysteine Promotes Metastatic Spread of Melanoma in Mice'). 'Metastatic growth' is also a narrower endpoint than 'metastasis' — it speaks to growth of lesions, not to dissemination.","cites":["L10","f5","p2"]},{"claim_index":1,"verdict":"supported","reason":"f10 is a direct restatement, including the Bach1-knockout xenograft reduction in lymph node and liver metastasis. Single_source (L36, support 0.542) and animal-only; no patient data, so nothing here generalises beyond mouse melanoma xenografts. Note the claim preserves f10's generic wording 'following antioxidant administration', which the hypothesis later contradicts by narrowing it to vitamins C/A.","cites":["L36","f10","p3"]},{"claim_index":2,"verdict":"supported","reason":"Accurate as a statement about the pack: g27 records that t2 and t8 both connect to t11 with no direct link reported and never searched for; only t11 is shared. The claim is correctly scoped to the pack rather than to the literature, which is the only defensible form given the sampling caveat.","cites":["g27","t2","t8","t11"]},{"claim_index":3,"verdict":"unsupported","reason":"No finding in the pack measures BACH1 after Trolox, or measures Trolox's degree of ROS lowering, or reports any null result. f5 contains no molecular readout at all; f10 contains no Trolox arm. The cited support is g27, i.e. an explicitly unsearched gap, plus INFERRED. Additionally f10's phrasing ('activated following antioxidant administration') is the only evidence touching the question and points the other way, so the claim is not merely unevidenced but in tension with the one relevant sentence.","cites":["f5","f10","g27"]},{"claim_index":4,"verdict":"unsupported","reason":"Pure inference; no epistasis experiment exists in the pack. f10's Bach1-KO arm was run without Trolox, and f5's Trolox arm was run in a different paper/model with a different endpoint ('metastatic growth' vs 'lymph node and liver metastasis'). The added 'with the same effect size' is a quantitative prediction with zero numerical basis in either f5 or f10.","cites":["L10","L36","f5","f10"]},{"claim_index":5,"verdict":"unsupported","reason":"Requires three measurements the pack lacks: BACH1 status under NAC, BACH1 status under Trolox, and matched ROS-lowering across agents. The NAC pro-metastatic effect is drawn from p2's title, not from any finding (the pack's only p2 finding is f5). And the framing of p3 ('ROS-lowering doses ... accelerate metastasis') makes dose, not molecular identity, the variable the source itself emphasises — the claim asserts the opposite ordering without evidence.","cites":["p2","p3","f5","f10"]}],"alternative_explanation":"A dose/exposure story with no BACH1 specificity at all. p3 is explicitly about ROS-lowering doses (title, f10); if the Trolox regimen in p2 did not lower intratumoral ROS to that threshold — different molecule (water-soluble Trolox, not \timschtiming, non-melanoma-cell-autonomous or stromal action — then the divergent metastasis outcome is quantitative pharmacology, and Trolox might well activate BACH1 at a ROS-lowering dose. A second dull reading: the endpoints simply differ. f5 reports reduced metastatic *growth*; f10/p3 report accelerated *dissemination* to lymph node and liver. An agent can shrink established lesions while a BACH1-driven dissemination program is untouched, which needs no claim about Trolox and BACH1 in either direction. Third: both edges are single-source with support ~0.55 from two unrelated groups (Obrador 2022, Kashif 2023) using different xenograft systems; the apparent contrast may be model variance rather than a mechanistic dissociation to be explained.","lens":"evidence"}],"verdict":"partly_supported","verification":{"verdict":"qualified","gates":[{"name":"structure","status":"pass","summary":"2 hop(s), path intact, not already stated","issues":[],"halting":true},{"name":"citations","status":"pass","summary":"10 ids, all legal","issues":[],"halting":true},{"name":"consistency","status":"warn","summary":"claim[1] cites L36 in the reverse of its stated direction but is not marked inferred","issues":[{"code":"reversed_link_asserted","detail":"claim[1] cites L36 in the reverse of its stated direction but is not marked inferred","severity":"warning"}],"halting":false},{"name":"independence","status":"pass","summary":"2 independent group(s), 2 primary findings","issues":[],"halting":true},{"name":"falsifiability","status":"pass","summary":"falsifier and experiment both concrete","issues":[],"halting":false},{"name":"adversarial","status":"warn","summary":"2 lenses (mechanism, evidence) → partly_supported","issues":[],"halting":false}],"halted_at":null},"elo":null,"evolved_from":null,"evolution_operator":null,"issues":[{"code":"reversed_link_asserted","detail":"claim[1] cites L36 in the reverse of its stated direction but is not marked inferred","severity":"warning"}],"asks":[],"provenance":"gap_closure over g_e087@round1 via L10, L36"}],"asks":[]};
const esc = x => String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n3 = v => (v==null||Number.isNaN(v))?"—":(+v).toFixed(3);
const n2 = v => (v==null||Number.isNaN(v))?"—":(+v).toFixed(2);
const pct = v => Math.max(0,Math.min(100,Math.round((v||0)*100)))+"%";

const AXES = [
  ["support","--support","measured on this graph: study type × agreement × independence"],
  ["novelty","--novelty","how far from what the graph already states; scaled by coverage reliability"],
  ["testability","--testability","how cheaply a wet-lab could discriminate it"],
  ["contradiction_risk","--risk","how much of the evidence points the other way"],
  ["structure","--structure","hub-damped path weight — is the connection load-bearing or a hub artefact"],
];

document.getElementById("q").textContent = S.question || "(question not recorded)";
const c = S.counts||{}, cov = S.coverage||{};
document.getElementById("qmeta").innerHTML =
  `<code>${esc(S.graph_id||"—")}</code> round ${esc(S.round)} · `
  + `${(S.hypotheses||[]).length} hypotheses`
  + (c.enumerated!=null?` of ${c.enumerated} enumerated`:"")
  + (cov.depth?` · graph coverage ${esc(cov.depth)}${cov.truncated?", truncated":""}`:"");
document.getElementById("legend").innerHTML =
  `<b>Motifs:</b> <code>gap_closure</code> a link the graph implies but nobody stated · `
  + `<code>transitive_chain</code> A→B→C exists, A→C does not · `
  + `<code>analogical_transfer</code> two nodes share neighbours, one has an edge the other lacks · `
  + `<code>condition_split</code> a disagreed link reread as a boundary condition.<br>`
  + `The five score axes are reported separately and never averaged — a textbook fact scores support 1.0 / novelty 0.0, and any single number would rank it first. `
  + `<code>rank_score</code> only orders the page.`;

function meter(val,color){ return `<div class="bar"><i style="width:${pct(val)};background:var(${color})"></i></div>`; }

function chain(h){
  const p = h.path||[];
  if(!p.length) return `<div class="chain"><span class="node">${esc(h.subject_name||h.subject)}</span>`
    + `<span class="arr">→</span><span class="node">${esc(h.object_name||h.object)}</span></div>`;
  let out = `<div class="chain"><span class="node">${esc(h.subject_name||h.subject)}</span>`;
  for(const e of p){
    const how = esc(e.how||"");
    out += `<span class="arr">${e.reversed?'<span class="rev">↮ '+how+' (reversed)</span>':how} →</span>`;
    out += `<span class="node">${esc(e.to_name||e.to||"")}</span>`;
  }
  return out+`</div>`;
}

function flags(h){
  const out=[];
  const v = h.verdict;
  if(v){ const cls = v==="verified"?"ok":"verdict"; out.push(`<span class="flag ${cls}">verdict: ${esc(v)}</span>`); }
  (h.caveats||[]).forEach(c=>out.push(`<span class="flag">⚠ ${esc(c)}</span>`));
  (h.issues||[]).forEach(i=>out.push(`<span class="flag">${esc(i.severity||"issue")}: ${esc(i.message||i.code||"")}</span>`));
  if(h.blocked) out.push(`<span class="flag">blocked</span>`);
  return out.length?`<div class="flags">${out.join("")}</div>`:"";
}

function claims(a){
  if(!a || !a.claims || !a.claims.length) return "";
  return `<div class="sec"><h3>Claims — each separately checkable</h3>`
    + a.claims.map(cl=>`<div class="claim">${esc(cl.text)}
        ${cl.inferred?`<span class="inferred">inferred — not stated by the graph</span>`:""}
        ${(cl.cites&&cl.cites.length)?`<div class="cite">${cl.cites.map(esc).join(" · ")}</div>`:""}
      </div>`).join("")
    + `</div>`;
}

function critics(h){
  const cr = h.critiques||[];
  if(!cr.length) return "";
  return `<details><summary>${cr.length} critic${cr.length===1?"":"s"}</summary>`
    + cr.map(x=>`<div class="crit"><span class="lens">${esc(x.lens||x.role||"critic")}</span> — ${esc(x.verdict||x.assessment||"")}
        ${x.rationale||x.critique?`<div class="muted">${esc(x.rationale||x.critique)}</div>`:""}</div>`).join("")
    + `</details>`;
}

function verifyTable(h){
  const v = h.verification;
  if(!v || !v.gates) return "";
  return `<details><summary>Verification gates (cost order; a halt skips the rest)</summary>`
    + `<div class="sec">` + v.gates.map(g=>`<div class="crit"><span class="lens">${esc(g.name)}</span> — <b>${esc(g.status)}</b> ${g.detail?`<span class="muted">${esc(g.detail)}</span>`:""}</div>`).join("")
    + `</div></details>`;
}

document.getElementById("cards").innerHTML = (S.hypotheses||[]).map((h,i)=>{
  const sc = h.scores||{};
  const a = h.articulation;
  const scoreRows = AXES.map(([k,col,tip])=>
    `<div class="k" title="${esc(tip)}">${k.replace(/_/g,' ')}</div>${meter(sc[k],col)}<div class="v">${n2(sc[k])}</div>`
  ).join("");
  return `<div class="card h">
    <div class="htop">
      <span class="rank">#${i+1}</span>
      <span class="motif">${esc(String(h.motif||"").replace(/_/g,' '))}</span>
      <span class="hid">${esc(h.id)} · rank ${n3(h.rank_score)} · ${h.hops!=null?h.hops+" hop"+(h.hops===1?"":"s"):""}</span>
    </div>
    ${a&&a.statement?`<p class="statement">${esc(a.statement)}</p>`:`<p class="statement muted">${esc(h.subject_name||h.subject)} → ${esc(h.object_name||h.object)} <span class="muted">(not articulated — model step did not run for this one)</span></p>`}
    ${a&&a.mechanism?`<p class="mech">${esc(a.mechanism)}</p>`:""}
    ${chain(h)}
    <div class="scores rankbar">${scoreRows}</div>
    ${flags(h)}
    ${a&&a.novel_because?`<div class="sec"><h3>Novel because</h3><div>${esc(a.novel_because)}</div></div>`:""}
    ${a&&a.falsifier?`<div class="sec"><h3>The single observation that would kill it</h3><div class="kill">${esc(a.falsifier)}</div></div>`:""}
    ${a&&a.decisive_experiment?`<div class="sec"><h3>Cheapest discriminating experiment</h3><div class="exp">${esc(a.decisive_experiment)}</div></div>`:""}
    ${a&&a.predictions&&a.predictions.length?`<div class="sec"><h3>Predictions</h3>${a.predictions.map(p=>`<div class="claim">${esc(p)}</div>`).join("")}</div>`:""}
    ${claims(a)}
    ${a&&a.assumptions&&a.assumptions.length?`<div class="sec"><h3>Assumptions not in the graph</h3>${a.assumptions.map(x=>`<div class="claim">${esc(x)}</div>`).join("")}</div>`:""}
    ${critics(h)}
    ${verifyTable(h)}
    ${(h.asks&&h.asks.length)?`<div class="sec"><h3>Asks back to the graph</h3>${h.asks.map(k=>`<div class="claim"><code>${esc(k.ask)}</code> → ${esc(k.target)} <span class="muted">${esc(k.reason||"")}</span></div>`).join("")}</div>`:""}
  </div>`;
}).join("");

document.getElementById("theme").onclick = ()=>{
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark?"dark":"light");
  document.documentElement.dataset.theme = cur==="dark"?"light":"dark";
};
</script>
</div>
</div>
